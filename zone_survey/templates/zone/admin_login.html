{% extends 'zone/base.html' %}
{% block title %}관리자 로그인{% endblock %}
{% block body %}
<div class="wrap" style="max-width:400px;padding-top:15vh">
  <form method="post" class="card" style="padding:24px">
    <div class="eyebrow">유바디 2마을</div>
    <h1>구역편성 관리자</h1>
    <p class="muted small">여름사역 소통방 관리자 계정으로 로그인되어 있으면 바로 들어갈 수 있어요.</p>
    <input type="password" name="password" placeholder="관리자 비밀번호" autofocus required>
    {% if error %}<p class="small" style="color:var(--danger)">{{ error }}</p>{% endif %}
    <button class="btn primary" style="width:100%;margin-top:12px">들어가기</button>
  </form>
</div>
{% endblock %}
