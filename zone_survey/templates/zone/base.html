<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ year }} 구역편성 기초자료{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --line: #e3e6ea; --text: #1d2228; --muted: #6b7480;
  --accent: #2f6fdb; --accent-soft: #e9f0fc; --ok: #1f9d55; --ok-soft: #e6f6ec;
  --warn: #c27c0e; --warn-soft: #fdf3e1; --danger: #c93c3c;
  --A: #1f9d55; --B: #3a7bd5; --C: #d08a10; --D: #c93c3c;
  --radius: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; line-height: 1.5; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }
.wrap.wide { max-width: 1200px; }
header.top { background: var(--card); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-top: 20px; padding-bottom: 16px; }
.eyebrow { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .02em; }
h1 { font-size: 22px; margin: 4px 0 6px; }
h2 { font-size: 17px; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 500;
  cursor: pointer; text-decoration: none; min-height: 44px; }
.btn:hover { border-color: #c7ccd3; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:disabled { opacity: .5; cursor: default; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px;
  background: #eef0f3; color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.blue { background: var(--accent-soft); color: var(--accent); }
.grade { display: inline-flex; width: 26px; height: 26px; border-radius: 8px; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 14px; }
.grade.A { background: var(--A); } .grade.B { background: var(--B); } .grade.C { background: var(--C); } .grade.D { background: var(--D); }
input[type=text], input[type=tel], input[type=password], select, textarea {
  width: 100%; font: inherit; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 11px; min-height: 42px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.progress { height: 8px; background: #e7eaee; border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: #1d2228; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: .25s; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<div class="toast" id="toast"></div>
<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
